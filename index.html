function priceRow(item, ids){
  const row = document.createElement('div');
  row.className = 'price-row';
  const cells = ids.map(id => {
    const e = (item.prices || {})[id] || {};
    return `<div class="price-cell" data-v="${esc(id)}">
        <input class="p-price" data-v="${esc(id)}" inputmode="decimal"
               placeholder="$" value="${esc(e.price || '')}">
        <input class="p-qty" data-v="${esc(id)}" inputmode="decimal"
               placeholder="${esc(t('perCase'))}" value="${esc(e.qty || '')}">
        <div class="price-sub"></div>
      </div>`;
  }).join('');
  row.innerHTML =
    `<div class="price-name"><span class="nm">${esc(itemName(item.name))}</span>
       <input class="p-unit" list="unitList" placeholder="${esc(t('cmpUnitPh'))}"
              value="${esc(item.cmpUnit || '')}"></div>
     <div class="price-cells">${cells}</div>
     <div class="price-delta" hidden></div>`;

  // Repaint only this row rather than calling render(). A full render rebuilds
  // all 1000-odd inputs and throws away focus, which on a phone also closes the
  // keyboard — unusable when the job is typing 211 prices in a sitting.
  const onEdit = ev => {
    const cell = ev.target.closest('.price-cell');
    if(!cell) return;
    setPrice(item.id, cell.dataset.v,
             cell.querySelector('.p-price').value,
             cell.querySelector('.p-qty').value);
    paintPriceRow(row, item, ids);
    paintPriceHead();
    paintPriceFoot();
  };
  row.querySelectorAll('.p-price, .p-qty').forEach(el => { el.onchange = onEdit; });
  row.querySelector('.p-unit').onchange = e => {
    setCmpUnit(item.id, e.target.value);
    paintPriceRow(row, item, ids);
  };

  paintPriceRow(row, item, ids);
  return row;
}

/* Everything derived from the numbers lives here, so a price edit can refresh
   one row without rebuilding the list. */
function paintPriceRow(row, item, ids){
  const c = comparePrices(item, ids);
  const unit = item.cmpUnit || '';
  row.classList.toggle('unpriced', c.mode === 'none');
  ids.forEach(id => {
    const cell = row.querySelector('.price-cell[data-v="' + id + '"]');
    if(!cell) return;
    cell.classList.toggle('win', c.winner === id && c.mode !== 'none');
    const val = c.values[id];
    let sub = '';
    if(!isNaN(val)){
      if(c.mode === 'unit') sub = unitMoney(val) + (unit ? '/' + unit : '');
      else if(c.mode === 'sticker') sub = t('stickerOnly');
    }
    cell.querySelector('.price-sub').textContent = sub;
  });
  const d = row.querySelector('.price-delta');
  if(c.delta && c.delta > 0){
    d.hidden = false;
    d.textContent = vendorName(c.winner) + ' ' + t('saves') + ' ' +
      (c.mode === 'unit' ? unitMoney(c.delta) + (unit ? '/' + unit : '') : money(c.delta));
  } else {
    d.hidden = true;
    d.textContent = '';
  }
}

function paintPriceHead(){
  const el = $('priceProgress');
  if(!el) return;
  const ids = vendorIds();
  const stock = doc.items.filter(i => i.type === 'stock');
  const priced = stock.filter(i => comparePrices(i, ids).mode !== 'none').length;
  el.textContent = priced + ' ' + t('ofPriced') + ' ' + stock.length;
}

/* Totals what you would ACTUALLY pay each distributor if you sent the split
   the app just worked out — not "the whole list priced at Ferraro" vs "the
   whole list priced at Destefano". Those two numbers look comparable and are
   not: whichever vendor happens to quote fewer of your items always looks
   cheaper, because the items they do not stock silently count as zero. */
function paintPriceFoot(){
  const el = $('priceFoot');
  if(!el) return;
  const ids = vendorIds();
  const need = doc.items.filter(i => i.type === 'stock' && i.status === 'need');
  const buckets = splitOrder(need, ids);
  const parts = ids.map(id => {
    const total = buckets[id].reduce((sum, i) => {
      const c = lineCost(i, id);
      return sum + (isNaN(c) ? 0 : c);
    }, 0);
    return `<span>${esc(vendorName(id))} <b>${esc(money(total))}</b></span>`;
  });
  if(buckets.none.length){
    parts.push(`<span style="color:var(--ink-faint)">${buckets.none.length} ${esc(t('pricedNone'))}</span>`);
  }
  el.innerHTML = parts.join('<i>·</i>');
}

function renderLock(root, pin){
  const setting = !pin;
  const wrap = document.createElement('div');
  wrap.className = 'lock';
  wrap.innerHTML =
    `<div class="ic">🔒</div>
     <div class="t">${esc(t('lockTitle'))}</div>
     <div class="s">${esc(setting ? t('lockSetSub') : t('lockSub'))}</div>
     <input class="pin-input" id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">
     <button class="btn btn-primary" id="pinGo" style="width:auto;padding:13px 32px;">${esc(setting ? t('setPin') : t('unlock'))}</button>
     <div class="pin-err" id="pinErr"></div>`;
  root.appendChild(wrap);
  const input = $('pinIn');
  const go = () => {
    const v = input.value.trim();
    if(setting){
      if(!/^\d{4}$/.test(v)){ $('pinErr').textContent = t('pinTooShort'); return; }
      doc.settings = Object.assign({}, doc.settings, { pin:v, at:nowISO() });
      moneyUnlocked = true;
      queueSave(); render();
      return;
    }
    if(v === pin){ moneyUnlocked = true; render(); }
    else { $('pinErr').textContent = t('wrongPin'); input.value = ''; input.focus(); }
  };
  $('pinGo').onclick = go;
  input.onkeydown = e => { if(e.key === 'Enter') go(); };
  setTimeout(() => input.focus(), 60);
}
function aggregate(period){
  // A hand-edited backend file could contain a row with no date; one of those
  // used to throw and blank the entire Money tab.
  const logs = doc.salesLog.filter(e => e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
    .sort((a,b) => a.date.localeCompare(b.date));
  // Show the year once a range spans more than one, so two different Januaries
  // don't both render as "Jan".
  const years = {};
  logs.forEach(e => { years[e.date.slice(0,4)] = 1; });
  const multiYear = Object.keys(years).length > 1;
  const label = k => {
    const [y,m,d] = k.split('-').map(Number);
    const opts = period === 'month' ? { month:'short' } : { month:'short', day:'numeric' };
    if(multiYear) opts.year = '2-digit';
    return new Date(y, m-1, d || 1).toLocaleDateString(locale(), opts);
  };
  if(period === 'day'){
    return logs.slice(-14).map(e => ({ label:label(e.date), cash:num(e.cash,0), card:num(e.card,0),
      total:num(e.cash,0) + num(e.card,0) }));
  }
  const buckets = {};
  logs.forEach(e => {
    let key;
    if(period === 'week'){
      const [y,m,d] = e.date.split('-').map(Number);
      const dt = new Date(y, m-1, d);
      dt.setDate(dt.getDate() - dt.getDay());
      key = todayStr(dt);
    } else key = String(e.date).slice(0,7);
    if(!buckets[key]) buckets[key] = { cash:0, card:0 };
    buckets[key].cash += num(e.cash,0);
    buckets[key].card += num(e.card,0);
  });
  return Object.keys(buckets).sort().slice(period === 'week' ? -8 : -12).map(k => ({
    label:label(k), cash:buckets[k].cash, card:buckets[k].card,
    total:buckets[k].cash + buckets[k].card
  }));
}
function chartSVG(data){
  const w = 340, h = 170, padB = 26, padT = 22, gap = 6;
  const barW = Math.max(6, (w - gap*(data.length-1)) / data.length);
  const max = Math.max.apply(null, data.map(d => d.total).concat([1]));
  const scale = (h - padT - padB) / max;
  const short = n => n >= 1000 ? '$' + (n/1000).toFixed(1) + 'k' : '$' + Math.round(n);
  let bars = '';
  data.forEach((d,i) => {
    const x = i * (barW + gap);
    const cashH = Math.max(0, d.cash * scale);
    const cardH = Math.max(0, d.card * scale);
    const top = h - padB - cashH - cardH;
    bars +=
      // CSS variables go in `style`, not in presentation attributes —
      // `fill="var(--x)"` is not reliably supported and renders black.
      `<rect x="${x}" y="${h-padB-cashH}" width="${barW}" height="${cashH}" style="fill:var(--basil)" rx="2"/>` +
      `<rect x="${x}" y="${top}" width="${barW}" height="${cardH}" style="fill:var(--amber)" rx="2"/>` +
      (d.total > 0 ? `<text x="${x+barW/2}" y="${top-5}" font-size="8.5" text-anchor="middle" style="fill:var(--ink-dim)" font-weight="700">${esc(short(d.total))}</text>` : '') +
      `<text x="${x+barW/2}" y="${h-9}" font-size="7.5" text-anchor="middle" style="fill:var(--ink-faint)">${esc(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}
function exportCsv(){
  const rows = [['Date','Cash','Card','Total','Saved by']];
  doc.salesLog.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
    const c = num(e.cash,0), k = num(e.card,0);
    rows.push([e.date, c.toFixed(2), k.toFixed(2), (c+k).toFixed(2), e.by || '']);
  });
  downloadCsv(rows, 'panatieris-sales-' + todayStr() + '.csv');
}

/* Shared by both exports. The BOM is what makes Excel open a UTF-8 CSV without
   mangling the Spanish item names. */
function downloadCsv(rows, filename){
  const csv = rows.map(r => r.map(v => {
    const t = String(v == null ? '' : v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
  }).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function exportPrices(){
  const vs = vendors(), ids = vendorIds();
  const header = ['Item','Category','Unit','Order qty','Compare unit'];
  vs.forEach(v => header.push(v.name + ' price', v.name + ' per case', v.name + ' unit cost'));
  header.push('Cheaper','Basis');
  const rows = [header];
  doc.items.filter(i => i.type === 'stock').forEach(i => {
    const c = comparePrices(i, ids);
    const r = [i.name, i.cat, i.unit, i.par, i.cmpUnit || ''];
    ids.forEach(id => {
      const e = (i.prices || {})[id] || {};
      const u = unitCost(e);
      r.push(e.price || '', e.qty || '', isNaN(u) ? '' : u.toFixed(4));
    });
    r.push(c.winner ? vendorName(c.winner) : '', c.mode);
    rows.push(r);
  });
  downloadCsv(rows, 'panatieris-prices-' + todayStr() + '.csv');
}

/* ---------- settings ---------- */
function openSettings(){
  openSheet(t('settings'), body => {
    body.innerHTML =
      `<div class="field-label">${esc(t('syncUrl'))}</div>
       <input class="field" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false">
       <div class="field-label">${esc(t('syncToken'))}</div>
       <input class="field" id="sTok" type="password" autocomplete="off">
       <div class="field-hint">${esc(t('syncHelp'))}</div>
       <div class="field-hint" id="sTest" style="font-weight:800;margin-top:10px;"></div>
       <div class="field-label">${esc(t('changePin'))}</div>
       <input class="field" id="sPin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
       <div class="field-hint">${esc(t('pinHelp'))}</div>
       <div class="field-label">${esc(t('vendorsLabel'))}</div>
       <input class="field" id="sV1" autocomplete="off" spellcheck="false">
       <input class="field" id="sV2" autocomplete="off" spellcheck="false" style="margin-top:8px;">
       <div class="field-hint">${esc(t('vendorsHint'))}</div>`;
    $('sUrl').value = prefs.syncUrl || '';
    $('sTok').value = prefs.syncToken || '';
    $('sPin').value = (doc.settings && doc.settings.pin) || '';
    const vs0 = vendors();
    $('sV1').value = vs0[0].name;
    $('sV2').value = vs0[1].name;

    const test = document.createElement('button');
    test.className = 'btn btn-ghost';
    test.style.marginTop = '18px';
    test.textContent = t('testConn');
    test.onclick = async () => {
      const url = $('sUrl').value.trim();
      const tok = $('sTok').value.trim();
      const out = $('sTest');
      if(!url){ out.style.color = 'var(--tomato)'; out.textContent = t('enterUrl'); return; }
      out.style.color = 'var(--ink-dim)';
      out.textContent = t('testing');
      try{
        const res = await fetchTimeout(url + '?action=ping&token=' + encodeURIComponent(tok));
        const data = await res.json();
        if(data.error === 'unauthorized'){ out.style.color = 'var(--tomato)'; out.textContent = '✕ ' + t('badToken'); return; }
        if(data.error){ out.style.color = 'var(--tomato)'; out.textContent = '✕ ' + data.error; return; }
        out.style.color = 'var(--good)'; out.textContent = '✓ ' + t('connected');
      }catch(e){
        out.style.color = 'var(--tomato)'; out.textContent = '✕ ' + t('cantReach');
      }
    };
    body.appendChild(test);

    const save = document.createElement('button');
    save.className = 'btn btn-primary';
    save.textContent = t('save');
    save.onclick = () => {
      prefs.syncUrl   = $('sUrl').value.trim();
      prefs.syncToken = $('sTok').value.trim();
      savePrefs();
      const p = $('sPin').value.trim();
      const current = (doc.settings && doc.settings.pin) || '';
      if(p !== current){
        if(p && !/^\d{4}$/.test(p)){ flash(t('pinTooShort'), true); return; }
        doc.settings = Object.assign({}, doc.settings, { pin:p, at:nowISO() });
        moneyUnlocked = false;
      }
      // Ids stay v1/v2 no matter what these are renamed to, so every price
      // already entered stays attached to the right distributor.
      doc.settings = Object.assign({}, doc.settings, {
        vendors: [
          { id:'v1', name: $('sV1').value.trim() || VENDOR_DEFAULTS[0].name },
          { id:'v2', name: $('sV2').value.trim() || VENDOR_DEFAULTS[1].name }
        ],
        at: nowISO()
      });
      queueSave();
      closeSheet();
      flash(t('saved'));
      refresh(true);
    };
    body.appendChild(save);
  });
}

/* ---------- header wiring ---------- */
$('whoInput').value = prefs.who || '';
const savePrefsSoon = debounce(savePrefs, 400);
$('whoInput').addEventListener('input', e => {
  // Update the name immediately — only the write to disk is debounced. If it
  // waited, someone who types their name and taps an item straight away would
  // get logged as "someone".
  prefs.who = e.target.value;
  savePrefsSoon();
});

$('refreshBtn').onclick = () => {
  if(!prefs.syncUrl){ flash(t('notConnected'), true); openSettings(); return; }
  refresh(true);
};
$('settingsBtn').onclick = openSettings;
$('langBtn').onclick = () => {
  lang = lang === 'en' ? 'es' : 'en';

};
function applyStatic(){

  $('langBtn').textContent = lang === 'en' ? 'ES' : 'EN';
  $('brandSub').textContent = lang === 'en' ? 'Stock & ordering' : 'Inventario y pedidos';
  $('confirmYes').textContent = t('done');
  $('confirmNo').textContent = t('cancel');
}
if(prefs.lang === 'es' || prefs.lang === 'en') lang = prefs.lang;
applyStatic();

/* Background refresh. Merges rather than replaces, so it can't eat an edit
   someone is making right now. Pauses while the tab is hidden. */
setInterval(() => {
  flushPendingRender();                       // catch any update parked while typing
  if(document.hidden || !prefs.syncUrl) return;
  if(saveQueued) runSave();                   // retry anything stranded offline
  refresh(false);
}, 60000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && prefs.syncUrl) refresh(false);
});
// A pending save must not be lost if the phone is locked or the app is closed.
document.addEventListener('visibilitychange', () => { if(document.hidden && saveQueued) writeLocal(doc); });
window.addEventListener('pagehide', () => { if(saveQueued) writeLocal(doc); });

loadAll().then(() => {
  if(autoConnected) flash(syncOk ? t('connected') : t('syncFail'));
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
