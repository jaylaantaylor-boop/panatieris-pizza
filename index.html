<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panatieri's Pizza</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1E5B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panatieri's">
<style>
  /* Fonts are system-only on purpose: the truck often has bad signal, and a
     web font that fails to load would leave staff staring at a blank screen. */
  :root{
    --page:#F7EAD2;
    --app:#FFFCF5;
    --surface:#F4E8CE;
    --ink:#2A2018;
    --ink-dim:#6F6350;
    --ink-faint:#A0937C;
    --border:#EADCBC;
    --border-strong:#DFC79A;
    --basil:#1E5B3A;
    --basil-soft:#E4F0E8;
    --tomato:#C0341C;
    --tomato-soft:#FBE3DB;
    --amber:#B37D12;
    --amber-soft:#FBF0D2;
    --good:#357030;
    --good-soft:#E7F3E1;
    --shadow-sm:0 1px 2px rgba(50,32,10,.07);
    --shadow-md:0 4px 16px rgba(50,32,10,.09);
    --shadow-lg:0 12px 40px rgba(50,32,10,.15);
    --display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --navh:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    font-family:var(--body);
    color:var(--ink);
    min-height:100vh;
    font-size:16px;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;} /* 16px stops iOS zoom-on-focus */

  .shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--app);
    box-shadow:var(--shadow-lg);display:flex;flex-direction:column;}
  .stripe{height:5px;background:repeating-linear-gradient(90deg,var(--tomato) 0 12px,var(--app) 12px 24px);flex-shrink:0;}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:11px;padding:14px 16px 10px;flex-shrink:0;}
  .mark{width:44px;height:44px;border-radius:12px;flex-shrink:0;object-fit:cover;
    border:1px solid var(--border-strong);box-shadow:var(--shadow-sm);}
  .brand{flex:1;min-width:0;}
  h1{font-family:var(--display);font-weight:700;font-size:1.32rem;margin:0;letter-spacing:-.2px;line-height:1.1;}
  .brand .sub{color:var(--ink-faint);font-size:.74rem;margin-top:2px;}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--surface);
    border:1px solid var(--border-strong);color:var(--ink-dim);font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .icon-btn:active{transform:scale(.93);}
  .icon-btn.lang{font-size:.7rem;font-weight:800;}
  .icon-btn.spinning{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .whorow{padding:0 16px 10px;}
  .whopill{display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;padding:10px 13px;}
  .whopill span{font-size:.85rem;flex-shrink:0;}
  .whopill input{background:transparent;border:none;outline:none;width:100%;color:var(--ink);font-size:.92rem;font-weight:600;}
  .whopill input::placeholder{color:var(--ink-faint);font-weight:400;}

  .status{font-size:.72rem;color:var(--ink-faint);text-align:center;min-height:16px;padding:0 16px 6px;}
  .status.warn{color:var(--tomato);font-weight:700;}

  /* ---------- main / nav ---------- */
  main{flex:1;padding:2px 16px 26px;}
  .bottom-nav{
    position:sticky;bottom:0;display:flex;background:var(--app);
    border-top:1px solid var(--border);flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1;background:none;border:none;cursor:pointer;padding:9px 2px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-faint);font-size:.68rem;font-weight:700;position:relative;
    min-height:var(--navh);justify-content:center;
  }
  .nav-btn .ic{font-size:1.32rem;line-height:1;}
  .nav-btn.active{color:var(--basil);}
  .nav-btn.active .ic{transform:scale(1.06);}
  .nav-badge{
    position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:800;
    background:var(--tomato);color:#fff;border-radius:20px;border:2px solid var(--app);
  }

  /* ---------- generic bits ---------- */
  .section-title{font-size:.71rem;text-transform:uppercase;letter-spacing:.7px;
    color:var(--ink-faint);font-weight:800;margin:22px 0 9px;}
  .section-title:first-child{margin-top:14px;}
  .empty{color:var(--ink-dim);font-size:.88rem;padding:24px 18px;text-align:center;
    background:var(--good-soft);border-radius:13px;border:1px solid var(--border);line-height:1.5;}
  .empty.plain{background:var(--surface);}

  .btn{
    width:100%;border:none;border-radius:13px;padding:15px;font-size:.94rem;font-weight:700;
    cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn:active{transform:scale(.985);}
  .btn-primary{background:var(--basil);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);}
  .btn-danger{background:var(--tomato);color:#fff;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-sm{width:auto;padding:9px 15px;font-size:.8rem;border-radius:10px;margin:0;}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:3px 0 11px;scrollbar-width:none;}

  /* ---------- prices ---------- */
  .price-head{margin-bottom:9px;}
  .price-progress{font-size:.82rem;color:var(--ink-dim);font-weight:700;margin-bottom:5px;}
  /* Mirrors .price-row's padding + border so each label sits over its column. */
  .price-cols{display:flex;gap:6px;padding:0 11px;}
  .price-cols span{flex:1;min-width:0;text-align:center;font-size:.7rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .price-row{border:1px solid var(--border);border-radius:12px;padding:7px 10px;
    margin-bottom:6px;background:var(--app);}
  .price-row.unpriced{background:var(--surface);opacity:.72;}
  .price-name{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .price-name .nm{flex:1;font-weight:700;font-size:.95rem;line-height:1.25;}
  .p-unit{width:74px;flex-shrink:0;border:1px solid var(--border-strong);border-radius:8px;
    padding:5px 7px;font-size:16px;background:var(--app);color:var(--ink);text-align:center;}
  .price-cells{display:flex;gap:6px;}
  .price-cell{flex:1;min-width:0;border:1px solid var(--border);border-radius:9px;padding:4px;
    background:var(--surface);}
  .price-cell.win{border-color:var(--good);background:var(--good-soft);}
  .price-cell input{width:100%;border:1px solid var(--border-strong);border-radius:7px;
    padding:5px 4px;font-size:16px;background:var(--app);color:var(--ink);text-align:center;}
  .price-cell .p-qty{margin-top:3px;}
  .price-sub{text-align:center;font-size:.72rem;font-weight:800;color:var(--ink-dim);
    margin-top:4px;min-height:1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .price-cell.win .price-sub{color:var(--good);}
  .price-delta{margin-top:6px;font-size:.76rem;font-weight:800;color:var(--good);}
  /* Sits above the fixed bottom nav, not behind it. */
  .price-foot{position:sticky;bottom:var(--navh);z-index:5;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:8px;padding:9px 12px;margin:12px -16px 0;background:var(--app);
    border-top:1px solid var(--border-strong);font-size:.84rem;
    box-shadow:0 -4px 14px rgba(50,32,10,.09);}
  .price-foot i{color:var(--ink-faint);font-style:normal;}
  .price-foot b{font-variant-numeric:tabular-nums;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-dim);
    border-radius:20px;padding:9px 15px;font-size:.81rem;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--basil);border-color:var(--basil);color:#fff;}
  .chip .cnt{opacity:.65;font-weight:600;margin-left:3px;}

  .search{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:12px 14px;color:var(--ink);font-size:.92rem;outline:none;margin:12px 0 4px;
  }
  .search::placeholder{color:var(--ink-faint);}
  .search:focus{border-color:var(--border-strong);}

  /* ---------- today ---------- */
  .stat-row{display:flex;gap:10px;margin:14px 0 16px;}
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:15px 10px;text-align:center;cursor:pointer;
  }
  .stat:active{transform:scale(.97);}
  .stat .n{font-family:var(--display);font-size:1.85rem;font-weight:700;line-height:1;}
  .stat .l{font-size:.66rem;color:var(--ink-faint);margin-top:6px;text-transform:uppercase;
    letter-spacing:.5px;font-weight:800;}
  .stat.need .n{color:var(--tomato);}
  .stat.ok .n{color:var(--good);}

  .att-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--app);border:1px solid var(--border);border-radius:12px;
    padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:pointer;
  }
  .att-row:active{transform:scale(.985);}
  .att-left{flex:1;min-width:0;}
  .att-name{font-weight:700;font-size:.9rem;display:flex;align-items:flex-start;gap:8px;}
  .att-name .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;background:var(--tomato);}
  .att-row.warn .att-name .dot{background:var(--amber);}
  .att-name .txt{overflow-wrap:anywhere;}
  .att-cat{font-size:.71rem;color:var(--ink-faint);margin-top:2px;margin-left:16px;}
  .att-val{font-size:.79rem;color:var(--ink-dim);font-weight:700;flex-shrink:0;white-space:nowrap;}

  /* ---------- stock items ---------- */
  .cat-head{font-family:var(--display);font-weight:700;font-size:1rem;margin:20px 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;}
  .cat-head .n{font-family:var(--body);font-size:.7rem;color:var(--ink-faint);font-weight:700;}
  .item{
    background:var(--app);border:1px solid var(--border);border-radius:14px;
    padding:12px 13px 11px;box-shadow:var(--shadow-sm);margin-bottom:9px;
  }
  .item.need{border-color:#EFC9BF;background:#FFFAF8;}
  .item-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;}
  .item-name{flex:1;min-width:0;font-size:.94rem;font-weight:700;overflow-wrap:anywhere;line-height:1.3;}
  .more-btn{
    flex-shrink:0;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-dim);font-size:1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;margin-top:-2px;
  }
  .more-btn:active{transform:scale(.92);}
  .toggle{display:flex;gap:8px;}
  .toggle button{
    flex:1;padding:13px 8px;border-radius:11px;font-size:.86rem;font-weight:800;cursor:pointer;
    border:1.5px solid var(--border-strong);background:var(--surface);color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;gap:5px;min-height:46px;
  }
  .toggle button:active{transform:scale(.97);}
  .toggle .t-have.on{background:var(--good-soft);border-color:var(--good);color:var(--good);}
  .toggle .t-need.on{background:var(--tomato-soft);border-color:var(--tomato);color:var(--tomato);}
  .item-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-top:9px;font-size:.71rem;color:var(--ink-faint);}
  .item-order{font-weight:800;color:var(--tomato);}
  .item-note{font-size:.76rem;color:var(--ink-dim);background:var(--surface);border-radius:8px;
    padding:7px 9px;margin-top:9px;overflow-wrap:anywhere;}
  .item.flash{animation:flash 1.5s ease;}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--basil);}100%{box-shadow:var(--shadow-sm);}}

  /* safety cards */
  .safety-line{font-size:.8rem;color:var(--ink-dim);margin-bottom:10px;}
  .safety-line b{color:var(--ink);}
  .pill-tag{font-size:.63rem;font-weight:800;padding:4px 9px;border-radius:20px;
    letter-spacing:.3px;flex-shrink:0;text-transform:uppercase;}
  .pill-tag.bad{background:var(--tomato-soft);color:var(--tomato);}
  .pill-tag.warn{background:var(--amber-soft);color:var(--amber);}
  .pill-tag.good{background:var(--good-soft);color:var(--good);}
  .inline-row{display:flex;gap:8px;align-items:center;}
  .inline-row input{
    flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-size:.92rem;outline:none;
  }
  .readings{font-size:.74rem;color:var(--ink-faint);margin-top:9px;line-height:1.7;}
  .readings .bad{color:var(--tomato);font-weight:700;}

  /* ---------- money ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;
    padding:15px;margin-bottom:14px;}
  .card.plain{background:var(--app);box-shadow:var(--shadow-sm);}
  .datenav{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .datenav .d{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:1rem;}
  .step{width:38px;height:38px;border-radius:10px;border:1px solid var(--border-strong);
    background:var(--app);color:var(--ink-dim);font-size:1.1rem;cursor:pointer;flex-shrink:0;}
  .step:disabled{opacity:.3;cursor:default;}
  .money-row{display:flex;gap:10px;margin-bottom:11px;}
  .money-field{flex:1;}
  .money-label{font-size:.68rem;font-weight:800;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:5px;}
  .money-input{
    width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--border-strong);
    background:var(--app);color:var(--ink);font-size:1.05rem;font-weight:700;outline:none;
  }
  .money-total{font-size:.9rem;font-weight:800;color:var(--basil);margin-bottom:12px;}
  .chart{width:100%;height:160px;display:block;}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:.74rem;color:var(--ink-dim);font-weight:700;}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;font-style:normal;}
  .mo-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
  .mo-title{font-family:var(--display);font-weight:700;font-size:.95rem;}
  .mo-total{font-size:.9rem;font-weight:800;color:var(--basil);}
  .mo-sub{font-size:.71rem;color:var(--ink-faint);margin-top:4px;}
  .mo-days{margin-top:11px;border-top:1px solid var(--border);padding-top:9px;}
  .day-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.79rem;gap:8px;}
  .day-date{color:var(--ink-dim);font-weight:700;}
  .day-nums{display:flex;gap:10px;color:var(--ink-faint);flex-shrink:0;}
  .day-nums b{color:var(--ink);}

  /* ---------- logs ---------- */
  .log{background:var(--surface);border:1px solid var(--border);border-radius:13px;
    padding:13px;margin-bottom:10px;}
  .log-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
  .log-title{font-size:.86rem;font-weight:800;overflow-wrap:anywhere;}
  .log-tag{font-size:.71rem;color:var(--ink-faint);flex-shrink:0;font-weight:700;}
  .log-meta{font-size:.73rem;color:var(--ink-faint);line-height:1.5;overflow-wrap:anywhere;}
  .log-msg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.73rem;color:var(--ink-dim);
    white-space:pre-wrap;background:var(--app);border-radius:9px;padding:10px;margin:0 0 9px;line-height:1.5;
    max-height:190px;overflow:auto;}
  .log.photo{display:flex;gap:11px;align-items:flex-start;}
  .log.photo img{width:62px;height:62px;object-fit:cover;border-radius:9px;flex-shrink:0;
    border:1px solid var(--border);cursor:pointer;}
  .log.photo .log-body{flex:1;min-width:0;}

  /* ---------- lock ---------- */
  .lock{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 20px 30px;}
  .lock .ic{font-size:2rem;margin-bottom:8px;}
  .lock .t{font-family:var(--display);font-weight:700;font-size:1.12rem;}
  .lock .s{font-size:.81rem;color:var(--ink-faint);margin:5px 0 20px;line-height:1.5;max-width:300px;}
  .pin-input{
    width:158px;text-align:center;font-size:1.5rem;letter-spacing:9px;padding:13px;
    border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);
    color:var(--ink);margin-bottom:14px;outline:none;
  }
  .pin-err{font-size:.78rem;color:var(--tomato);margin-top:12px;min-height:18px;font-weight:700;}

  /* ---------- modals ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(42,32,24,.5);display:none;
    align-items:flex-end;justify-content:center;z-index:60;padding:0;
  }
  .backdrop.show{display:flex;}
  .sheet{
    background:var(--app);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    max-height:88vh;display:flex;flex-direction:column;animation:slideUp .2s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  @keyframes slideUp{from{transform:translateY(22px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .sheet-title{font-family:var(--display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere;}
  .sheet-close{background:var(--surface);border:none;color:var(--ink-dim);font-size:.95rem;
    width:32px;height:32px;border-radius:50%;cursor:pointer;flex-shrink:0;}
  .sheet-body{padding:16px 18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .field-label{font-size:.7rem;font-weight:800;color:var(--ink-dim);margin:15px 0 6px;
    text-transform:uppercase;letter-spacing:.4px;}
  .field-label:first-child{margin-top:0;}
  .field{
    width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);font-size:.94rem;outline:none;
  }
  .field-hint{font-size:.72rem;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
  .sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .sheet-actions .btn-sm{flex:1;min-width:120px;justify-content:center;}

  .hist-entry{padding:10px 0;border-bottom:1px solid var(--border);}
  .hist-entry:last-child{border-bottom:none;}
  .hist-line{font-size:.83rem;line-height:1.45;overflow-wrap:anywhere;}
  .hist-meta{font-size:.71rem;color:var(--ink-faint);margin-top:3px;}

  .picker-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:13px;margin-bottom:7px;cursor:pointer;text-align:left;font-size:.9rem;font-weight:600;
    color:var(--ink);
  }
  .picker-item:active{transform:scale(.985);}
  .picker-item .c{font-size:.71rem;color:var(--ink-faint);flex-shrink:0;font-weight:600;}

  .photo-row{display:flex;align-items:center;gap:11px;}
  .photo-prev{position:relative;display:inline-flex;}
  .photo-prev img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
  .photo-x{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;
    background:var(--tomato);color:#fff;border:2px solid var(--app);font-size:.68rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;}

  .toast{
    position:fixed;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:.85rem;
    font-weight:700;z-index:90;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .2s;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;}

  footer{font-size:.71rem;color:var(--ink-faint);text-align:center;line-height:1.6;

/* Seeded items get a STABLE id derived from their name, never a random one.
   Otherwise every phone that installs the app mints 61 brand-new ids, and
   because the merge matches on id you end up with 122 items, then 183 — a
   second "Burgers" row nobody can tell apart. Same name, same id, everywhere. */
function seedId(name){
  return 'seed-' + String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function seedDoc(){
  let ord = 0;
  const items = SEED.map(([name,cat,unit,par]) => ({
    id:seedId(name), type:'stock', name, cat, unit, par, ord:ord++,
    cmpUnit:'', prices:{},
    // Seeded as stocked: a brand-new install showing 60 red "need to order"
    // rows is useless noise. Staff flag what's actually low.
    status:'have', note:'', history:[], updatedBy:'', updatedAt:null
  }));
  [['Fire extinguisher inspection'], ['Hood and filter cleaning']].forEach(([name]) => {
    items.push({ id:seedId(name), type:'check', name, cat:'Safety/Ops', ord:ord++,
      nextDue:null, history:[], updatedBy:'', updatedAt:null });
  });
  [['Walk-in cooler temp', 34, 40], ['Freezer temp', -10, 10]].forEach(([name,min,max]) => {
    items.push({ id:seedId(name), type:'log', name, cat:'Safety/Ops', unit:'°F',
      min, max, ord:ord++, logs:[], history:[], updatedBy:'', updatedAt:null });
  });
  return { items, wasteLog:[], orderLog:[], salesLog:[], deleted:{},
           settings:{ pin:'', vendors: VENDOR_DEFAULTS.map(v => ({ id:v.id, name:v.name })) } };
}

/* Vendor list read through a function so a half-written settings blob can
   never leave the Prices screen with one column missing. */
function vendors(){
  const vs = (doc && doc.settings && doc.settings.vendors) || [];
  return VENDOR_DEFAULTS.map(d => {
    const found = vs.filter(v => v && v.id === d.id)[0];
    const name = found && String(found.name || '').trim();
    return { id:d.id, name: name || d.name };
  });
}
function vendorIds(){ return vendors().map(v => v.id); }
function vendorName(id){
  const v = vendors().filter(x => x.id === id)[0];
  return v ? v.name : id;
}
function setPrice(itemId, vendorId, price, qty){
  const i = findItem(itemId);
  if(!i) return;
  if(!i.prices) i.prices = {};
  const p = String(price == null ? '' : price).trim();
  const q = String(qty == null ? '' : qty).trim();
  if(!p && !q) delete i.prices[vendorId];
  else i.prices[vendorId] = { price:p, qty:q, at:nowISO(), by:who() };
  i.updatedBy = who();
  i.updatedAt = nowISO();   // without this the merge cannot tell which side is newer
  queueSave();
}
function setCmpUnit(itemId, unit){
  const i = findItem(itemId);
  if(!i) return;
  i.cmpUnit = String(unit || '').trim();
  i.updatedBy = who();
  i.updatedAt = nowISO();
  queueSave();
}

/* Pure and dependency-free on purpose: tests/pricing.test.mjs extracts
   everything between these two markers and runs it under node, so nothing here
   may reach for `doc`, `lang`, the DOM, or anything else defined elsewhere in
   this file. Keep the markers on their own lines — the test matches them
   literally. */
var VENDOR_DEFAULTS = [{ id:'v1', name:'Ferraro' }, { id:'v2', name:'Destefano' }];

/* Same tolerant parsing as parseMoney, but a price of zero or less is a
   data-entry slip rather than a real quote, so it reads as "not priced". */
function priceNum(v){
  if(typeof v === 'number') return isFinite(v) && v > 0 ? v : NaN;
  var s = String(v == null ? '' : v).trim().replace(/[$€£\s]/g, '');
  if(!s) return NaN;
  if(s.indexOf(',') > -1 && s.indexOf('.') > -1){
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '');
  } else if(s.indexOf(',') > -1){
    s = s.replace(',', '.');
  }
  var n = parseFloat(s);
  return isFinite(n) && n > 0 ? n : NaN;
}

function unitCost(entry){
  if(!entry) return NaN;
  var p = priceNum(entry.price);
  if(isNaN(p)) return NaN;
  var q = priceNum(entry.qty);
  return isNaN(q) ? NaN : p / q;
}

/* Compares one item across vendors and says which is cheaper, and how much to
   trust that answer. 'unit' means both sides were pack-adjusted; 'sticker'
   means at least one side had no pack size, so we compared the price tag alone
   and the screen must say so rather than implying a like-for-like win. */
function comparePrices(item, vendorIds){
  var ids = vendorIds && vendorIds.length ? vendorIds : ['v1','v2'];
  var prices = (item && item.prices) || {};
  var priced = ids.filter(function(id){ return !isNaN(priceNum((prices[id] || {}).price)); });
  if(!priced.length) return { mode:'none', winner:null, priced:[], values:{}, delta:null };
  if(priced.length === 1){
    var only = {};
    only[priced[0]] = priceNum(prices[priced[0]].price);
    return { mode:'single', winner:priced[0], priced:priced, values:only, delta:null };
  }
  var allUnit = priced.every(function(id){ return !isNaN(unitCost(prices[id])); });
  var values = {}, winner = null, best = Infinity;
  priced.forEach(function(id){
    var v = allUnit ? unitCost(prices[id]) : priceNum(prices[id].price);
    values[id] = v;
    if(v < best){ best = v; winner = id; }   // strict < keeps ties on the first vendor
  });
  var runnerUp = Infinity;
  priced.forEach(function(id){ if(id !== winner && values[id] < runnerUp) runnerUp = values[id]; });
  return {
    mode: allUnit ? 'unit' : 'sticker',
    winner: winner, priced: priced, values: values,
    delta: isFinite(runnerUp) ? runnerUp - best : null
  };
}

/* An item nobody has priced lands in `none` rather than being dropped or
   quietly handed to one vendor — a half-priced catalogue must not lose items
   off the order. */
function splitOrder(items, vendorIds){
  var ids = vendorIds && vendorIds.length ? vendorIds : ['v1','v2'];
  var out = { none: [] };
  ids.forEach(function(id){ out[id] = []; });
  (items || []).forEach(function(i){
    var c = comparePrices(i, ids);
    (c.winner && out[c.winner] ? out[c.winner] : out.none).push(i);
  });
  return out;
}

/* Unit costs need more decimals than money(): at 2dp a $0.0375/oz quote and a
   $0.0350/oz quote both render "$0.04" and the screen shows a tie that is not
   really there. Trailing zeros are trimmed, but never below 2 decimals — a
   saving shown as "$0.3" reads like a typo where "$0.30" reads like money. */
function unitMoney(n){
  var v = typeof n === 'number' ? n : parseFloat(n);
  if(!isFinite(v)) return '';
  var s = v >= 1 ? v.toFixed(2)
                 : v.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  var dot = s.indexOf('.');
  if(dot < 0) s += '.00';
  else while(s.length - dot - 1 < 2) s += '0';
  return '$' + s;
}

function lineCost(item, vendorId){
  var e = item && item.prices && item.prices[vendorId];
  var p = priceNum(e && e.price);
  if(isNaN(p)) return NaN;
  var par = priceNum(item.par);
  return p * (isNaN(par) ? 1 : par);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowISO(){ return new Date().toISOString(); }
function ts(v){ const n = Date.parse(v||''); return isNaN(n) ? 0 : n; }
function num(v, fallback){ const n = parseFloat(v); return isNaN(n) ? fallback : n; }
/* Accepts what people actually type: "12,50" (Spanish keyboards and half the
   world), "$12.50", "1 234,50". Returns NaN for genuine nonsense so callers
   can refuse to save rather than writing a silent 0 over real takings. */
function parseMoney(v){
  if(typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v).trim().replace(/[$€£\s]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',') > -1 && s.indexOf('.') > -1){
    s = s.lastIndexOf(',') > s.lastIndexOf('.')       // 1.234,50 vs 1,234.50
      ? s.replace(/\./g,'').replace(',','.')
      : s.replace(/,/g,'');
  } else if(s.indexOf(',') > -1){
    s = s.replace(',', '.');
  }
  if(!/^-?\d*\.?\d*$/.test(s)) return NaN;
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
function debounce(fn, ms){ let h=null; return function(...a){ clearTimeout(h); h=setTimeout(()=>fn.apply(this,a), ms); }; }
function timeAgo(iso){
  if(!iso) return '';
  const m = Math.floor((Date.now() - ts(iso)) / 60000);
  if(m < 1) return t('justNow');
  if(m < 60) return t('mAgo', m);
  const h = Math.floor(m/60);
  if(h < 24) return t('hAgo', h);
  return t('dAgo', Math.floor(h/24));
}
function fullTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString(locale(),{month:'short',day:'numeric'}) + ' ' + t('at') + ' ' +
         d.toLocaleTimeString(locale(),{hour:'numeric',minute:'2-digit'});
}
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return todayStr(dt);
}
function niceDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(locale(),{weekday:'short',month:'short',day:'numeric'});
}
function money(n){ return '$' + (Math.round((num(n,0))*100)/100).toFixed(2); }

/* ---------------------------------------------------- merge (the core) --- */
/* Two phones editing at once used to overwrite each other because the whole
   document was replaced wholesale. Now every record is merged on its own:
   items by newest edit, logs by union, sales by newest edit per day. The
   backend runs the same merge under a lock — see apps-script/Code.gs. */
function mergeHistory(a, b){
  const seen = new Set(), out = [];
  [].concat(a||[], b||[]).forEach(h => {
    if(!h) return;
    const k = [h.at,h.by,h.field,h.from,h.to,h.qty,h.reason].join('|');
    if(seen.has(k)) return;
    seen.add(k); out.push(h);
  });
  out.sort((x,y) => ts(x.at) - ts(y.at));
  return out.slice(-40);
}
function mergeReadings(a, b){
  const seen = new Set(), out = [];
  [].concat(a||[], b||[]).forEach(r => {
    if(!r) return;
    const k = [r.at,r.by,r.value].join('|');
    if(seen.has(k)) return;
    seen.add(k); out.push(r);
  });
  out.sort((x,y) => ts(x.at) - ts(y.at));
  return out.slice(-60);
}
function mergeItems(a, b, deleted){
  const map = new Map();
  [].concat(a||[], b||[]).forEach(it => {
    if(!it || !it.id) return;
    const gone = deleted && deleted[it.id];
    if(gone && ts(gone) >= ts(it.updatedAt)) return;   // deletion wins unless edited later
    const prev = map.get(it.id);
    if(!prev){ map.set(it.id, Object.assign({}, it)); return; }
    // >= so that on an exact tie the SECOND argument wins. Callers pass the
    // local/incoming copy second, so the person who just tapped keeps their tap.
    const winner = ts(it.updatedAt) >= ts(prev.updatedAt) ? it : prev;
    const merged = Object.assign({}, winner);
    merged.history = mergeHistory(prev.history, it.history);
    if(prev.logs || it.logs) merged.logs = mergeReadings(prev.logs, it.logs);
    map.set(it.id, merged);
  });
  return [...map.values()].sort((x,y) => (x.ord||0) - (y.ord||0));
}
function mergeById(a, b, cap){
  const map = new Map();
  [].concat(a||[], b||[]).forEach(e => { if(e && e.id) map.set(e.id, e); });
  const out = [...map.values()].sort((x,y) => ts(x.at) - ts(y.at));
  return cap ? out.slice(-cap) : out;
}
function mergeSales(a, b){
  const map = new Map();
  [].concat(a||[], b||[]).forEach(e => {
    if(!e || !e.date) return;
    const prev = map.get(e.date);
    if(!prev || ts(e.at) > ts(prev.at)) map.set(e.date, e);
  });
  return [...map.values()].sort((x,y) => x.date.localeCompare(y.date));
}
function mergeDocs(a, b){
  a = a || {}; b = b || {};
  const deleted = Object.assign({}, a.deleted, b.deleted);
  // forget tombstones after 60 days so the record doesn't grow forever
  const cutoff = Date.now() - 60*86400000;
  Object.keys(deleted).forEach(k => { if(ts(deleted[k]) < cutoff) delete deleted[k]; });
  const sa = a.settings || {}, sb = b.settings || {};
  return {
    items:    mergeItems(a.items, b.items, deleted),
    wasteLog: mergeById(a.wasteLog, b.wasteLog, 300),
    orderLog: mergeById(a.orderLog, b.orderLog, 60),
    salesLog: mergeSales(a.salesLog, b.salesLog),
    deleted,
    settings: ts(sb.at) >= ts(sa.at) ? sb : sa,
  };
}

/* --------------------------------------------------------------- store --- */
function fetchTimeout(url, opts, ms){
  const c = new AbortController();
  const timer = setTimeout(() => c.abort(), ms || 20000);
  return fetch(url, Object.assign({}, opts, { signal:c.signal })).finally(() => clearTimeout(timer));
}
function readLocal(){
  try{
    const raw = localStorage.getItem(DOC_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){
    // Corrupt JSON used to silently reset the whole truck to defaults. Keep a
    // copy instead so nothing is lost, and tell the user.
    try{ localStorage.setItem(DOC_KEY + '-broken-' + Date.now(), localStorage.getItem(DOC_KEY) || ''); }catch(e2){}
    flash(t('loadFailed'), true);
  }
  return null;
}
function writeLocal(d){
  try{
    localStorage.setItem(DOC_KEY, JSON.stringify(d));
    return true;
  }catch(e){
    // Out of space: try again with the oldest history trimmed. Build the
    // trimmed copy separately — trimming `d` in place and THEN failing would
    // throw away history for nothing.
    try{
      const slim = JSON.parse(JSON.stringify(d));
      slim.wasteLog = (slim.wasteLog||[]).slice(-80);
      slim.orderLog = (slim.orderLog||[]).slice(-15);
      (slim.items||[]).forEach(i => {
        if(i.history) i.history = i.history.slice(-12);
        if(i.logs)    i.logs    = i.logs.slice(-20);
      });
      localStorage.setItem(DOC_KEY, JSON.stringify(slim));
      d.wasteLog = slim.wasteLog; d.orderLog = slim.orderLog;
      (d.items||[]).forEach((i, n) => {
        const s = slim.items[n];
        if(s && i.id === s.id){ if(i.history) i.history = s.history; if(i.logs) i.logs = s.logs; }
      });
      flash(t('storageFull'), true);
      return true;
    }catch(e2){ return false; }
  }
}
let syncOk = true;
async function pullRemote(){
  if(!prefs.syncUrl) return null;
  const u = prefs.syncUrl + '?action=read&token=' + encodeURIComponent(prefs.syncToken || '');
  const res = await fetchTimeout(u);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.doc || null;
}
async function pushRemote(d){
  if(!prefs.syncUrl) return null;
  const res = await fetchTimeout(prefs.syncUrl, {
    method:'POST',
    // text/plain avoids a CORS preflight that Apps Script can't answer
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'write', token: prefs.syncToken || '', doc: d })
  }, 25000);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.doc || null;   // the server returns the merged result
}

/* Save: local first (instant, offline-proof), then push and adopt the merged
   copy the server sends back. */
let saveQueued = false, saving = false;
function queueSave(){
  if(!writeLocal(doc)) flash(t('storageFail'), true);
  saveQueued = true;
  runSave();
}
const runSave = debounce(async function(){
  if(saving || !saveQueued) return;
  if(!prefs.syncUrl){ saveQueued = false; setStatus(''); return; }
  saving = true; saveQueued = false;
  setStatus(t('saving'));
  try{
    const merged = await pushRemote(doc);
    // MERGE the server's answer into whatever `doc` is NOW — do not replace it.
    // The push takes up to 25s on truck signal, and anything tapped during
    // that window lives only in the current `doc`. Assigning the response
    // straight over the top silently threw those taps away.
    if(merged){
      doc = mergeDocs(normalize(merged), doc);
      writeLocal(doc);
      renderFromSync();
    }
    syncOk = true;
    setStatus(t('savedTick'));
    setTimeout(() => { if($('statusLine').textContent === t('savedTick')) setStatus(''); }, 1500);
  }catch(e){
    // Keep the work pending instead of dropping it. A shift's worth of taps
    // made in a dead zone used to be stranded on the phone forever, because
    // the background job only ever pulled.
    syncOk = false;
    saveQueued = true;
    setStatus(t('syncFail'), true);
  }
  saving = false;
  if(saveQueued && syncOk) runSave();   // only chase it while the network is good
}, 500);
// Flush anything stranded as soon as signal comes back.
window.addEventListener('online', () => {
  syncOk = true;
  if(saveQueued) runSave();
  refresh(false);
});

async function loadAll(){
  const local = readLocal() || migrateOld();
  if(local){
    doc = normalize(local);
    loaded = true;
    render();
    if(prefs.syncUrl) await refresh(false);
    return;
  }
  // Nothing stored on this phone. If it's already connected, take the truck's
  // real list rather than seeding a second copy of everything.
  if(prefs.syncUrl){
    setStatus(t('loading'));
    try{
      const remote = await pullRemote();
      if(remote && Array.isArray(remote.items) && remote.items.length){
        doc = normalize(remote);
        writeLocal(doc);
        loaded = true; setStatus(''); render();
        return;
      }
    }catch(e){ syncOk = false; }
  }
  doc = seedDoc();
  writeLocal(doc);
  loaded = true; setStatus(''); render();
  if(prefs.syncUrl) queueSave();
}

/* Pull + merge. Never replaces local edits — it merges them, so tapping a
   button right as the 60-second refresh fires can no longer lose the tap. */
let refreshing = false;
async function refresh(spin){
  if(refreshing || !prefs.syncUrl) return;
  refreshing = true;
  const btn = $('refreshBtn');
  if(spin && btn){ btn.classList.remove('spinning'); void btn.offsetWidth; btn.classList.add('spinning'); }
  try{
    const remote = await pullRemote();
    if(remote){
      doc = mergeDocs(normalize(remote), doc);
      writeLocal(doc);
      if(spin) render(); else renderFromSync();
    }
    syncOk = true;
    if(spin) setStatus('');
  }catch(e){
    syncOk = false;
    setStatus(t('syncFail'), true);
  }
  refreshing = false;
}

function normalize(d){
  d = d || {};
  const out = {
    items: Array.isArray(d.items) ? d.items : [],
    wasteLog: Array.isArray(d.wasteLog) ? d.wasteLog : [],
    orderLog: Array.isArray(d.orderLog) ? d.orderLog : [],
    salesLog: Array.isArray(d.salesLog) ? d.salesLog : [],
    deleted: (d.deleted && typeof d.deleted === 'object') ? d.deleted : {},
    settings: (d.settings && typeof d.settings === 'object') ? d.settings : { pin:'' },
  };
  // Vendor ids are the contract prices are keyed on, so they are rebuilt from
  // the defaults every load: a settings blob that lost one would otherwise
  // orphan every price stored against it.
  if(!Array.isArray(out.settings.vendors) || !out.settings.vendors.length){
    out.settings.vendors = VENDOR_DEFAULTS.map(v => ({ id:v.id, name:v.name }));
  }
  let ord = 0;
  out.items.forEach(i => {
    if(!i.id) i.id = uid();
    if(!i.type) i.type = 'stock';
    if(typeof i.ord !== 'number') i.ord = ord;
    ord = Math.max(ord, i.ord) + 1;
    if(!Array.isArray(i.history)) i.history = [];
    if(!ALL_CATS.includes(i.cat)) i.cat = 'Other';
    if(i.type === 'stock'){
      if(i.status !== 'need' && i.status !== 'have') i.status = 'have';
      i.par = Math.min(999999, Math.max(0, num(i.par, 1) || 0));
      if(typeof i.note !== 'string') i.note = '';
      if(typeof i.unit !== 'string' || !i.unit) i.unit = 'units';
      // Documents written before the Prices screen existed have neither field.
      if(!i.prices || typeof i.prices !== 'object') i.prices = {};
      if(typeof i.cmpUnit !== 'string') i.cmpUnit = '';
    }
    if(i.type === 'log' && !Array.isArray(i.logs)) i.logs = [];
  });
  out.wasteLog.forEach(e => { if(!e.id) e.id = uid(); });
  out.orderLog.forEach(e => { if(!e.id) e.id = uid(); });
  // A sales row with a missing or malformed date would throw in aggregate()
  // and blank the whole Money tab.
  out.salesLog = out.salesLog.filter(e => e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
  out.salesLog.forEach(e => {
    if(!e.id) e.id = uid();
    e.cash = Math.max(0, num(e.cash, 0));
    e.card = Math.max(0, num(e.card, 0));
  });
  return out;
}

/* One-time migration from the previous version so nobody loses their data. */
function migrateOld(){
  let old = null;
  try{ const raw = localStorage.getItem(OLD_KEY); if(raw) old = JSON.parse(raw); }catch(e){ return null; }
  if(!old || !Array.isArray(old.items)) return null;
  let ord = 0;
  const items = old.items.map(i => {
    const base = { id:i.id||uid(), type:i.type||'stock', name:i.name, cat:i.cat, ord:ord++,
      history:Array.isArray(i.history)?i.history:[], updatedBy:i.updatedBy||'', updatedAt:i.updatedAt||null };
    if(base.type === 'check') return Object.assign(base, { nextDue:i.nextDue||null });
    if(base.type === 'log')   return Object.assign(base, { unit:i.unit||'°F', min:num(i.min,34), max:num(i.max,40), logs:Array.isArray(i.logs)?i.logs:[] });
    // old model had out/low/full and need/have; fold it all down to need/have
    const st = (i.status === 'need' || i.status === 'out' || i.status === 'low') ? 'need' : 'have';
    return Object.assign(base, { unit:i.unit||'units', par:num(i.par,1), status:st, note:i.note||'' });
  });
  return { items,
    wasteLog: Array.isArray(old.wasteLog) ? old.wasteLog : [],
    orderLog: Array.isArray(old.orderLog) ? old.orderLog : [],
    salesLog: Array.isArray(old.salesLog) ? old.salesLog : [],
    deleted:{}, settings:{ pin:'' } };
}

/* ------------------------------------------------------------ mutations -- */
function touch(item){ item.updatedBy = who(); item.updatedAt = nowISO(); }
function logHist(item, field, from, to, extra){
  if(!item.history) item.history = [];
  item.history.push(Object.assign({ at:nowISO(), by:who(), field, from, to }, extra||{}));
  if(item.history.length > 40) item.history = item.history.slice(-40);
}
function findItem(id){ return doc.items.find(i => i.id === id); }

function setStatusFlag(id, status){
  const i = findItem(id);
  if(!i || i.status === status) return;
  const from = i.status;
  i.status = status;
  logHist(i, 'status', from, status);
  touch(i);
  queueSave();
  // Surgical update instead of a full re-render: tapping an item near the
  // bottom of a long list must not rebuild the page and throw away the
  // user's scroll position.
  const card = $('i-' + id);
  if(card && view === 'stock'){
    const fresh = stockCard(i);
    card.replaceWith(fresh);
    renderNav();
    if(stockNeedOnly) renderStockList();   // item may no longer belong in this filter
    renderStockChips();
  } else render();
}
function newDay(){
  const n = doc.items.filter(i => i.type === 'stock' && i.status === 'need').length;
  if(!n) return;
  confirmDialog(t('newDayConfirm')).then(yes => {
    if(!yes) return;
    doc.items.forEach(i => {
      if(i.type === 'stock' && i.status === 'need'){
        i.status = 'have';
        logHist(i, 'status', 'need', 'have');
        touch(i);
      }
    });
    queueSave(); render();
  });
}
function orderQty(i){ return i.status === 'need' ? (i.par || 0) : 0; }

function removeItem(id){
  const i = findItem(id);
  if(!i) return;
  doc.items = doc.items.filter(x => x.id !== id);
  doc.deleted[id] = nowISO();   // tombstone, so other phones don't resurrect it
  queueSave(); render();
}
function addItem(cat, name, unit, par){
  name = (name||'').trim();
  if(!name) return null;
  const maxOrd = doc.items.reduce((m,i) => Math.max(m, i.ord||0), 0);
  const item = { id:uid(), type:'stock', name, cat, unit:(unit||'').trim() || 'units',
    // Clamp both ends: an accidental "1e500" used to print "order Infinity bags".
    par: Math.min(999999, Math.max(0, num(par, 1) || 0)), status:'need', note:'', ord:maxOrd+1,
    history:[], updatedBy:who(), updatedAt:nowISO() };
  doc.items.push(item);
  queueSave(); render();
  return item;
}
function markInspected(id){
  const i = findItem(id);
  if(!i) return;
  const d = new Date(); d.setFullYear(d.getFullYear()+1);
  i.nextDue = todayStr(d);
  logHist(i, 'inspection', '', i.nextDue);
  touch(i); queueSave(); render();
}
function addReading(id, value){
  const i = findItem(id);
  const v = num(value, NaN);
  if(!i || isNaN(v)) return;
  if(!i.logs) i.logs = [];
  i.logs.push({ value:v, at:nowISO(), by:who() });
  if(i.logs.length > 60) i.logs = i.logs.slice(-60);
  touch(i); queueSave(); render();
}
function logWaste(itemId, qty, reason, note, photoUrl){
  const item = findItem(itemId);
  // The item can vanish under us if another phone removed it while this sheet
  // was open. Report that instead of cheerfully saying "Saved".
  if(!item || qty <= 0) return false;
  const entry = { id:uid(), at:nowISO(), by:who(), itemId, itemName:item.name, cat:item.cat,
    unit:item.unit || '', qty, reason, note:note||'', photoUrl:photoUrl||null };
  doc.wasteLog.push(entry);
  if(doc.wasteLog.length > 300) doc.wasteLog = doc.wasteLog.slice(-300);
  logHist(item, 'waste', '', '', { qty, reason });
  touch(item);
  queueSave(); render();
  return true;
}
/* Returns false rather than writing zeros when the numbers can't be read —
   overwriting a logged day's takings with $0.00 and saying "Saved" is worse
   than refusing. Blank means blank (0); junk means don't touch it. */
function saveSales(dateStr, cash, card){
  const c = String(cash).trim() === '' ? 0 : parseMoney(cash);
  const k = String(card).trim() === '' ? 0 : parseMoney(card);
  if(isNaN(c) || isNaN(k) || c < 0 || k < 0) return false;
  let e = doc.salesLog.find(x => x.date === dateStr);
  if(!e){ e = { id:uid(), date:dateStr, cash:0, card:0, by:'', at:null }; doc.salesLog.push(e); }
  e.cash = c; e.card = k;
  e.by = who(); e.at = nowISO();
  queueSave();
  return true;
}

/* ------------------------------------------------------------- status ---- */
function checkState(i){
  if(!i.nextDue) return 'warn';
  const days = daysUntil(i.nextDue);
  if(days === null) return 'warn';
  if(days < 0) return 'bad';
  if(days <= 30) return 'warn';
  return 'good';
}
function readingState(i){
  if(!i.logs || !i.logs.length) return 'warn';
  const last = i.logs[i.logs.length-1];
  return (last.value < i.min || last.value > i.max) ? 'bad' : 'good';
}
/* "2026-08-12" is parsed by Date as UTC midnight, so anywhere west of London
   an inspection due tomorrow reported as already overdue. Parse plain dates as
   LOCAL, and count whole days from the start of today so "due today" is 0. */
function tsLocalDate(s){
  if(typeof s !== 'string') return 0;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return ts(s);
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const due = tsLocalDate(dateStr);
  if(!due) return null;
  const n = new Date();
  const startOfToday = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  return Math.round((due - startOfToday) / 86400000);
}

/* ---------------------------------------------------------------- UI ----- */
function setStatus(msg, warn){
  const el = $('statusLine');
  el.textContent = msg || '';
  el.classList.toggle('warn', !!warn);
}
let toastTimer = null;
function flash(msg, warn){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), warn ? 4200 : 1900);
}

function openSheet(title, buildBody){

  const body = $('sheetBody');
  body.innerHTML = '';
  buildBody(body);
  $('sheetBackdrop').classList.add('show');

function closeSheet(){ $('sheetBackdrop').classList.remove('show'); }
$('sheetClose').onclick = closeSheet;
$('sheetBackdrop').onclick = e => { if(e.target.id === 'sheetBackdrop') closeSheet(); };

let confirmResolve = null;
function confirmDialog(text){
  if(confirmResolve) endConfirm(false);   // never leave an earlier promise hanging
  $('confirmText').textContent = text;
  $('confirmBackdrop').classList.add('show');
  return new Promise(res => { confirmResolve = res; });
}
function endConfirm(v){
  $('confirmBackdrop').classList.remove('show');
  if(confirmResolve){ confirmResolve(v); confirmResolve = null; }
}
$('confirmYes').onclick = () => endConfirm(true);
$('confirmNo').onclick  = () => endConfirm(false);
$('confirmBackdrop').onclick = e => { if(e.target.id === 'confirmBackdrop') endConfirm(false); };

/* ------------------------------------------------------------- render ---- */
/* A sync landing while someone is mid-entry used to blow the page away and
   take the half-typed cash total with it — every 60 seconds. Renders caused by
   a background sync now wait until the user stops typing / closes the sheet.
   Renders caused by the user's own tap always run immediately. */
let pendingSyncRender = false;
function userIsBusy(){
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return true;
  if($('sheetBackdrop').classList.contains('show')) return true;
  if($('confirmBackdrop').classList.contains('show')) return true;
  return false;
}
function renderFromSync(){
  if(userIsBusy()){ pendingSyncRender = true; return; }
  render();
}
function flushPendingRender(){
  if(pendingSyncRender && !userIsBusy()){ pendingSyncRender = false; render(); }
}
// Several chances to catch it: leaving a field, tapping anywhere, and the
// background timer. A deferred update must never get stuck waiting on one
// event that might not fire.
document.addEventListener('focusout', () => setTimeout(flushPendingRender, 120));
document.addEventListener('click',    () => setTimeout(flushPendingRender, 60));
document.addEventListener('touchend', () => setTimeout(flushPendingRender, 60));

let resetScroll = false;
function render(){
  if(!loaded) return;
  // A background sync landing mid-scroll must not yank the page around.
  const y = window.scrollY;
  renderNav();
  const root = $('view');
  root.innerHTML = '';
  if(view === 'today')      renderToday(root);
  else if(view === 'stock') renderStock(root);
  else if(view === 'waste') renderWaste(root);
  else if(view === 'prices') renderPrices(root);
  else if(view === 'money') renderMoney(root);
  if(resetScroll){ resetScroll = false; window.scrollTo(0,0); }
  else if(y) window.scrollTo(0, y);
}
function go(v){
  view = v;
  search = '';
  stockNeedOnly = false;          // a filter left on from last time is confusing
  if(v === 'money'){
    // A phone left running overnight opened Money on yesterday, prefilled with
    // yesterday's takings.
    const today = todayStr();
    if(!moneyDate || moneyDate > today) moneyDate = today;
  }
  resetScroll = true;
  render();
}

function renderNav(){
  const needCount = doc.items.filter(i => i.type === 'stock' && i.status === 'need').length
    + doc.items.filter(i => i.type === 'check' && checkState(i) === 'bad').length
    + doc.items.filter(i => i.type === 'log'   && readingState(i) === 'bad').length;
  const tabs = [
    ['today','navToday','🏠', needCount],
    ['stock','navStock','📦', 0],
    ['prices','navPrices','🏷', 0],
    ['waste','navWaste','🗑', 0],
    ['money','navMoney','💵', 0],
  ];
  const nav = $('nav');
  nav.innerHTML = '';
  tabs.forEach(([id,key,ic,badge]) => {
    const b = document.createElement('button');
    b.className = 'nav-btn' + (view === id ? ' active' : '');
    b.innerHTML = `<span class="ic">${ic}</span><span>${esc(t(key))}</span>` +
      (badge > 0 ? `<span class="nav-badge">${badge > 99 ? '99+' : badge}</span>` : '');
    b.onclick = () => go(id);
    nav.appendChild(b);
  });
}

/* ---------- Today ---------- */
function renderToday(root){
  const stock  = doc.items.filter(i => i.type === 'stock');
  const need   = stock.filter(i => i.status === 'need');
  const have   = stock.filter(i => i.status === 'have');
  const checks = doc.items.filter(i => i.type === 'check' && checkState(i) !== 'good');
  const logs   = doc.items.filter(i => i.type === 'log'   && readingState(i) !== 'good');

  const stats = document.createElement('div');
  stats.className = 'stat-row';
  stats.innerHTML =
    `<div class="stat need"><div class="n">${need.length}</div><div class="l">${esc(t('needToOrder'))}</div></div>
     <div class="stat ok"><div class="n">${have.length}</div><div class="l">${esc(t('stocked'))}</div></div>`;
  stats.children[0].onclick = () => { view='stock'; stockNeedOnly=true; stockGroup='all'; render(); };
  stats.children[1].onclick = () => { view='stock'; stockNeedOnly=false; stockGroup='all'; render(); };
  root.appendChild(stats);

  if(need.length){
    const canShare = !!(navigator.share);
    const icon = canShare ? '📤 ' : '📋 ';
    // One button per distributor. The unpriced block gets a plain-styled button
    // so it never looks like a ready-to-send order.
    buildOrderTexts().forEach(blk => {
      const b = document.createElement('button');
      b.className = 'btn ' + (blk.key === 'none' ? 'btn-ghost' : 'btn-primary');
      b.innerHTML = icon + esc(blk.title) + ' <span style="opacity:.7">(' + blk.count + ')</span>';
      b.onclick = () => sendOrder(blk);
      root.appendChild(b);
    });
  }
  if(need.length){
    const b2 = document.createElement('button');
    b2.className = 'btn btn-ghost';
    b2.innerHTML = '🔄 ' + esc(t('newDay'));
    b2.onclick = newDay;
    root.appendChild(b2);
  }

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = t('needsAttention');
  root.appendChild(title);

  if(!need.length && !checks.length && !logs.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = t('allGood');
    root.appendChild(e);
  } else {
    need.forEach(i => root.appendChild(attRow(i, 'bad',
      `${t('order')} ${i.par} ${unitName(i.unit)}`)));
    checks.forEach(i => {
      const d = daysUntil(i.nextDue);
      root.appendChild(attRow(i, checkState(i) === 'bad' ? 'bad' : 'warn',
        d === null ? t('noDate') : (d < 0 ? t('dOverdue', Math.abs(d)) : t('dLeft', d))));
    });
    logs.forEach(i => {
      const last = i.logs && i.logs.length ? i.logs[i.logs.length-1] : null;
      root.appendChild(attRow(i, 'bad', last ? `${last.value}${i.unit}` : t('noReading')));
    });

  f.textContent = t('footer');
  root.appendChild(f);

function attRow(item, kind, valText){
  const row = document.createElement('div');
  row.className = 'att-row ' + (kind === 'warn' ? 'warn' : '');
  row.innerHTML =
    `<div class="att-left">
       <div class="att-name"><span class="dot"></span><span class="txt">${esc(itemName(item.name))}</span></div>
       <div class="att-cat">${esc(catName(item.cat))}</div>

}
function jumpTo(item){
  view = 'stock';
  stockGroup = groupOf(item.cat);
  stockNeedOnly = false;
  search = '';
  render();
  requestAnimationFrame(() => {
    const el = $('i-' + item.id);

/* One text block per distributor, plus a third for anything nobody has priced.
   Returns [] when there is nothing flagged Need it. */
function buildOrderTexts(){
  const need = doc.items.filter(i => i.type === 'stock' && i.status === 'need');
  if(!need.length) return [];
  const ids = vendorIds();
  const buckets = splitOrder(need, ids);
  const stamp = new Date().toLocaleDateString(locale(),
    { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const block = (key, title, rows) => {
    if(!rows || !rows.length) return null;
    let total = 0;
    let msg = "Panatieri's Pizza\n" + stamp + '\n\n' + title + '\n';
    ALL_CATS.forEach(cat => {
      const inCat = rows.filter(i => i.cat === cat);
      if(!inCat.length) return;
      msg += '\n' + catName(cat).toUpperCase() + '\n';
      inCat.forEach(i => {
        const c = key === 'none' ? NaN : lineCost(i, key);
        if(!isNaN(c)) total += c;
        msg += '- ' + itemName(i.name) + ' — ' + i.par + ' ' + unitName(i.unit) +
               (isNaN(c) ? '' : ' — ' + money(c)) +
               (i.note ? ' (' + i.note + ')' : '') + '\n';
      });
    });
    if(total > 0) msg += '\n' + t('estTotal') + ' ' + money(total) + '\n';
    return { key:key, title:title, text: msg + '\n' + t('thanks'), total:total, count:rows.length };
  };

  const out = ids.map(id => block(id, t('orderFor') + ' ' + vendorName(id), buckets[id]))
                 .filter(Boolean);
  const orphans = block('none', t('orderNoPrice'), buckets.none);
  if(orphans) out.push(orphans);
  return out;
}
async function sendOrder(block){
  const msg = block.text;
  // Only record the order once it has actually gone somewhere. Logging first
  // meant a cancelled share still filled the order history with phantom lists.
  const record = () => {
    doc.orderLog.push({ id:uid(), at:nowISO(), by:who(), vendor:block.key, message:msg });
    if(doc.orderLog.length > 60) doc.orderLog = doc.orderLog.slice(-60);
    queueSave();
  };
  if(navigator.share){
    try{ await navigator.share({ text:msg }); record(); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }  // user hit cancel
  }
  copyText(msg);
  record();
}
function copyText(text){
  const done = () => flash(t('copied'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) done(); else window.prompt('Copy:', text);
}

function renderStockChips(){
  const chips = $('stockChips');

function visibleCats(){
  if(stockGroup === 'all') return ALL_CATS;
  const g = GROUPS.find(x => x.id === stockGroup);
  return g ? g.cats : ALL_CATS;
}
function renderStockList(){
  const list = $('stockList');
  if(!list) return;
  list.innerHTML = '';
  const q = search.trim().toLowerCase();
  let any = false;

  // A search looks across the WHOLE truck, not just the group chip you happen
  // to be on — otherwise searching "coke" from Food reports that it doesn't
  // exist and someone adds a second one.
  (q ? ALL_CATS : visibleCats()).forEach(cat => {
    let items = doc.items.filter(i => i.cat === cat);
    if(q) items = items.filter(i =>
      String(i.name).toLowerCase().includes(q) || String(itemName(i.name)).toLowerCase().includes(q));
    if(stockNeedOnly) items = items.filter(i =>
      (i.type === 'stock' && i.status === 'need') ||
      (i.type === 'check' && checkState(i) !== 'good') ||
      (i.type === 'log'   && readingState(i) !== 'good'));
    if(!items.length) return;
    any = true;

    const h = document.createElement('div');
    h.className = 'cat-head';
    h.innerHTML = `<span>${esc(catName(cat))}</span><span class="n">${items.length}</span>`;
    list.appendChild(h);

    items.forEach(i => {
      if(i.type === 'check')    list.appendChild(checkCard(i));
      else if(i.type === 'log') list.appendChild(logCard(i));
      else                      list.appendChild(stockCard(i));
    });
  });

  if(!any){
    const e = document.createElement('div');
    // "No items yet" when the needed-filter is simply empty reads as if the
    // app lost all 61 items. Say what actually happened.
    e.className = 'empty' + (stockNeedOnly && !q ? '' : ' plain');
    e.textContent = q ? t('noMatch') : (stockNeedOnly ? t('nothingNeededHere') : t('noItems'));
    list.appendChild(e);

  // "+ Add item" lands in whichever group you're looking at
  if(stockGroup !== 'all' && !q && !stockNeedOnly){
    const g = GROUPS.find(x => x.id === stockGroup);
    const b = document.createElement('button');
    b.className = 'btn btn-ghost';
    b.style.marginTop = '14px';
    b.textContent = t('addItem');
    b.onclick = () => openAddSheet(g.cats[0]);
    list.appendChild(b);
  }
}

function checkCard(i){

/* ---------- item detail sheet ---------- */
function openItemSheet(id){
  const i = findItem(id);
  if(!i) return;
  openSheet(itemName(i.name), body => {
    body.innerHTML =
      `<div class="field-label">${esc(t('itemName'))}</div>
       <input class="field" id="fName" value="${esc(i.name)}" maxlength="60">
       <div class="field-label">${esc(t('unit'))}</div>
       <input class="field" id="fUnit" value="${esc(i.unit)}" maxlength="20">
       <div class="field-label">${esc(t('orderQty'))}</div>
       <input class="field" id="fPar" type="number" inputmode="decimal" min="0" value="${esc(String(i.par))}">
       <div class="field-hint">${esc(t('orderQtyHint'))}</div>
       <div class="field-label">${esc(t('note'))}</div>
       <input class="field" id="fNote" value="${esc(i.note || '')}" maxlength="140" placeholder="${esc(t('notePlaceholder'))}">
       <div class="sheet-actions">
         <button class="btn btn-ghost btn-sm" id="bWaste">🗑 ${esc(t('logWaste'))}</button>
         <button class="btn btn-ghost btn-sm" id="bHist">🕘 ${esc(t('history'))}</button>
         <button class="btn btn-ghost btn-sm" id="bDel" style="color:var(--tomato);">${esc(t('removeItem'))}</button>
       </div>`;
    const save = document.createElement('button');
    save.className = 'btn btn-primary';
    save.style.marginTop = '18px';
    save.textContent = t('save');
    // What the fields said when the sheet opened. Saving only writes back the
    // fields the user actually TOUCHED — otherwise a sheet left open while
    // someone else edits the same item would push stale values over their
    // work the moment Save is tapped.
    const opened = { name:i.name, unit:i.unit, par:i.par, note:i.note || '' };
    // One history entry per save, not one per keystroke the way the old
    // debounced-oninput version did.
    save.onclick = () => {
      const it = findItem(id);
      if(!it){ closeSheet(); render(); flash(t('itemGone'), true); return; }
      const typed = {
        name: $('fName').value.trim() || opened.name,
        unit: $('fUnit').value.trim() || opened.unit,
        par:  Math.max(0, Math.min(999999, num($('fPar').value, opened.par))),
        note: $('fNote').value.trim(),
      };
      const labels = { name:'name', unit:'unit', par:'par', note:'note' };
      let changed = false;
      Object.keys(labels).forEach(f => {
        if(String(typed[f]) === String(opened[f])) return;      // user didn't touch it
        const current = f === 'note' ? (it.note || '') : it[f];
        if(String(typed[f]) === String(current)) return;         // already that value
        logHist(it, f, String(current || '—'), String(typed[f] || '—'));
        it[f] = typed[f];
        changed = true;
      });
      if(changed){ touch(it); queueSave(); }
      closeSheet(); render();
      if(changed) flash(t('saved'));
    };
    body.appendChild(save);

    $('bWaste').onclick = () => { closeSheet(); openWasteSheet(id); };
    $('bHist').onclick  = () => { closeSheet(); openHistorySheet(id); };
    $('bDel').onclick   = () => {
      confirmDialog(t('removeConfirm', itemName(i.name))).then(yes => {
        if(!yes) return;
        closeSheet();
        removeItem(id);
      });
    };
  });
}

function openHistorySheet(id){
  const i = findItem(id);

function histLine(item, h){

  if(h.field === 'waste')      return by + esc(t('hWaste', h.qty, unitName(item.unit), reasonName(h.reason)));

  const fieldNames = { name:t('fName'), unit:t('fUnit'), par:t('fOrderQty'), note:t('fNote') };
  return by + esc(t('hChanged', fieldNames[h.field] || h.field, h.from, h.to));

    REASONS.forEach(r => {
      const c = document.createElement('button');
      c.className = 'chip' + (r.id === reason ? ' active' : '');

        reason = r.id;
        [...wrap.children].forEach(x => x.classList.toggle('active', x === c));
      };
      wrap.appendChild(c);
    });

    const photoRow = $('wPhotoRow');
    if(canPhoto){
      const file = document.createElement('input');

      file.style.display = 'none';
      const pick = document.createElement('button');
      pick.className = 'btn btn-ghost btn-sm';
      pick.textContent = '📷 ' + t('addPhoto');
      pick.onclick = () => file.click();
      file.onchange = () => {
        const f = file.files && file.files[0];
        if(!f) return;
        shrinkImage(f, dataUrl => {
          pendingPhoto = { base64:dataUrl.split(',')[1], mimeType:'image/jpeg', filename:'waste-' + Date.now() + '.jpg' };
          photoRow.innerHTML = '';
          const prev = document.createElement('div');
          prev.className = 'photo-prev';
          const img = document.createElement('img');
          img.src = dataUrl;
          const x = document.createElement('button');
          x.className = 'photo-x';

          x.onclick = () => { pendingPhoto = null; file.value = ''; photoRow.innerHTML = ''; photoRow.appendChild(file); photoRow.appendChild(pick); };
          prev.appendChild(img); prev.appendChild(x);
          photoRow.appendChild(prev);
        });
      };
      photoRow.appendChild(file);

    }

    const submit = document.createElement('button');
    submit.className = 'btn btn-danger';
    submit.style.marginTop = '20px';

      const note = $('wNote').value.trim();
      let url = null;
      if(pendingPhoto){
        submit.disabled = true;
        submit.textContent = t('uploading');

        submit.disabled = false;
        submit.textContent = t('logWaste');
        if(!url){
          const go = await confirmDialog(t('photoFailed'));
          if(!go) return;
        }
      }
      const ok = logWaste(itemId, qty, reason, note, url);
      pendingPhoto = null;
      closeSheet();
      flash(ok ? t('saved') : t('itemGone'), !ok);
    };
    body.appendChild(submit);
    setTimeout(() => $('wQty').focus(), 60);
  });
}
function shrinkImage(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      let w = img.width, h = img.height;
      if(w > max || h > max){
        if(w > h){ h = Math.round(h * max / w); w = max; }
        else     { w = Math.round(w * max / h); h = max; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => flash('Photo could not be read', true);
    img.src = reader.result;
  };
  reader.onerror = () => flash('Photo could not be read', true);
  reader.readAsDataURL(file);
}
async function uploadPhoto(photo){
  if(!prefs.syncUrl) return null;
  try{
    const res = await fetchTimeout(prefs.syncUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'upload', token:prefs.syncToken || '',
        filename:photo.filename, mimeType:photo.mimeType, base64Data:photo.base64 })
    }, 40000);
    const data = await res.json();
    return (data && data.url) ? data.url : null;
  }catch(e){ return null; }
}
